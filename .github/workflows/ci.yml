name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # Haddad local fleet (MA005 pilot, user mlci); owner switch vars.MA014_CI_RUNNER=hosted -> ubuntu-latest.
    runs-on: ${{ vars.MA014_CI_RUNNER == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","mythos-haddad"]') }}
    # Public repository: never run a fork's pull request on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # no `cache: npm`: the repo has no lockfile, and setup-node fails hard without one
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
